<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面不存在 | 小猫会发光</title>
    <meta name="description" content="小猫会发光（xiaomaohuifaguang）的 404 页面，你访问的地址不存在。">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#030305">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <style>
        :root {
            --bg-primary: #030305;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-amber: #f59e0b;
            --accent-rose: #e11d48;
            --font-display: 'Arial', 'Microsoft YaHei', 'PingFang SC', sans-serif;
            --font-body: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif;
            --font-mono: 'Cascadia Code', 'SFMono-Regular', Consolas, monospace;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            padding: 2rem;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-body);
            line-height: 1.7;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }

        .code {
            font-family: var(--font-mono);
            font-size: clamp(4rem, 18vw, 8rem);
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-amber) 55%, var(--accent-rose) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 600;
        }

        p {
            max-width: 32rem;
            color: var(--text-secondary);
            font-size: 0.9375rem;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
            margin-top: 0.5rem;
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-size: 0.9375rem;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        a:hover {
            transform: translateY(-2px);
        }

        a:focus-visible {
            outline: 2px solid var(--accent-amber);
            outline-offset: 3px;
        }

        .primary {
            background: linear-gradient(135deg, var(--accent-amber), var(--accent-rose));
            color: var(--bg-primary);
            font-weight: 500;
        }

        .secondary {
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        @supports not ((-webkit-background-clip: text) or (background-clip: text)) {
            .code {
                background: none;
                -webkit-text-fill-color: currentColor;
                color: var(--accent-amber);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            a {
                transition: none;
            }

            a:hover {
                transform: none;
            }
        }
    </style>
</head>
<body>
    <div class="code">404</div>
    <h1>这个页面走丢了</h1>
    <p>你访问的地址不存在，或者已经被移动。可以回到首页，也可以去看看技术博客。</p>
    <div class="actions">
        <a class="primary" href="/">返回首页</a>
        <a class="secondary" href="https://xiaomaohuifaguang.github.io/blog/">技术博客</a>
    </div>
</body>
</html>
